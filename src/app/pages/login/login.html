<div class="login-container">

  <div class="login-box">

    <h1>Logistics Staff</h1>

    <p>Staff Management Portal</p>

    <form>

      <label>Email</label>
      <input
        type="email"
        placeholder="Enter staff email"
      >

      <label>Password</label>
      <input
        type="password"
        placeholder="Enter password"
      >

      <button type="submit">
        Login
      </button>

    </form>

  </div>

</div>
